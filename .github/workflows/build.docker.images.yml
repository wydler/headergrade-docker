---
name: Build & publish docker images

"on":
  workflow_dispatch:
  release:
    types:
      - released
      - prereleased

permissions:
  contents: read

env:
  REGISTRY: ${{ vars.REGISTRY }}
  REGISTRY_ACCOUNT: ${{ vars.REGISTRY_ACCOUNT }}
  REGISTRY_REPO: ${{ vars.REGISTRY_REPO }}
  REGISTRY_REPO_TAG_CACHE_NAME: ${{ vars.REGISTRY_REPO_TAG_CACHE_NAME }}
  REGISTRY_PLATFORMS: ${{ vars.REGISTRY_PLATFORMS }}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  set-variables:
    name: Set-Variables
    runs-on: ubuntu-slim

    permissions:
      contents: read

    steps:
      - name: Check required variables
        shell: bash
        run: |
          missing=0

          for var in \
            REGISTRY \
            REGISTRY_ACCOUNT \
            REGISTRY_REPO \
            REGISTRY_REPO_TAG_CACHE_NAME \
            REGISTRY_PLATFORMS
          do
            if [[ -z "${!var}" ]]; then
              echo "::error::Repository variable '$var' is missing."
              missing=1
            else
              echo "::notice::$var is configured."
            fi
          done

          exit $missing


  setup-build-push:
    name: Docker build & push
    runs-on: ubuntu-latest
    needs:
      - set-variables

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive        

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create tag list for docker image
        id: tags
        run: |

          # basename does remove the directory prefix of a path
          # https://stackoverflow.com/questions/3294072/get-last-dirname-filename-in-a-file-path-argument-in-bash
          container_tag=$(basename ${{ github.ref_name }})
          echo $container_tag

          if [ -n "${{ github.event.release.tag_name }}" ] && [ "${{ github.event.release.prerelease }}" != "true" ]; then
            image_tag="${{ github.event.release.tag_name }}"
          else
            image_tag="$container_tag"
          fi

          echo "docker=${{ env.REGISTRY_ACCOUNT }}/${{ env.REGISTRY_REPO }}:${image_tag}" >> "$GITHUB_OUTPUT"
          echo "docker_image_version=${image_tag}" >> "$GITHUB_OUTPUT"

      - name: Read latest commit from upstream/headergrade
        id: sm
        run: |
          VERSION=$(git -C upstream/headergrade log -1 --format=%h)
          echo "Neuster Commit aus upstream/headergrade: $VERSION"

          # Exportiere als GitHub Actions Output
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        id: build
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ steps.sm.outputs.version }}
            DOCKER_IMAGE_VERSION=${{ steps.tags.outputs.docker_image_version }}
          tags: ${{ steps.tags.outputs.docker }}
          platforms: ${{ env.REGISTRY_PLATFORMS }}
          cache-from: type=registry,ref=${{ env.REGISTRY_ACCOUNT }}/${{ env.REGISTRY_REPO }}:${{ env.REGISTRY_REPO_TAG_CACHE_NAME }}
          cache-to: type=registry,ref=${{ env.REGISTRY_ACCOUNT }}/${{ env.REGISTRY_REPO }}:${{ env.REGISTRY_REPO_TAG_CACHE_NAME }},mode=max
          sbom: true
          provenance: mode=max


      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Show Cosign version
        shell: bash
        run: |
          cosign version

      - name: Sign docker image with a key
        shell: bash
        run: |
          cosign sign \
            --verbose \
            --new-bundle-format=true \
            --use-signing-config=false \
            --yes \
            --key env://COSIGN_PRIVATE_KEY ${{ env.REGISTRY }}/${{ steps.tags.outputs.docker }}@${{ steps.build.outputs.digest }}
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.cosign_private_key }}
          COSIGN_PASSWORD: ${{ secrets.cosign_password }}

      - name: Verify image signature
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${{ env.REGISTRY }}/${{ steps.tags.outputs.docker }}@${{ steps.build.outputs.digest }}"

          for i in {1..12}; do
            echo "Verification attempt ${i}/12..."

            if cosign verify \
                --key cosign.pub \
                --output text \
                "${IMAGE}"; then
              echo "Signature verified."

              exit 0
            fi

            echo "Signature not yet available. Waiting 5 seconds..."
            sleep 5
          done

          echo "ERROR: Signature could not be verified after 60 seconds."
          exit 1

      - name: Show Cosign artifact tree
        shell: bash
        run: |
          cosign tree ${{ env.REGISTRY }}/${{ steps.tags.outputs.docker }}@${{ steps.build.outputs.digest }}


      - name: Promote image to latest
        if: github.event.release.prerelease == false && github.event.release.draft == false
        shell: bash
        run: |
          # Create or update the "latest" tag to point to the newly released image version.
          # This operation updates the manifest in the registry and preserves all platform variants.
          docker buildx imagetools create \
            -t "${{ env.REGISTRY_ACCOUNT }}/${{ env.REGISTRY_REPO }}:latest" \
            ${{ steps.tags.outputs.docker }}