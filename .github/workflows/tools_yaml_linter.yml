---
name: "Tools - Validate YAML Schema"

"on":
  workflow_dispatch:  
  pull_request:
    branches:
      - "master"
    paths:
      - ".yamllint"
      - "**.yaml"
      - "**.yml"
      - "**.yml.example"

permissions:
  contents: read

jobs:
  validate-yaml:
    name: YAML Linter
    runs-on: ubuntu-slim

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install YAML files
        run: sudo apt-get update && apt-get install -y yamllint

      - name: Validate YAML files
        run: yamllint .
